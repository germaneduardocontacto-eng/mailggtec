<form id="formCotizacion">
    <h3>Solicitar Cotización</h3>
    <input type="text" id="nombre" name="nombre" placeholder="Tu Nombre o Empresa" required>
    <input type="email" id="email" name="email" placeholder="Tu Correo Electrónico" required>
    <input type="text" id="producto" name="producto" placeholder="Producto o Servicio a cotizar" required>
    <textarea id="mensaje" name="mensaje" placeholder="Detalles de la cotización..." required></textarea>
    <button type="submit" id="btnCotizar">Enviar Cotización</button>
</form>

<p id="estadoCotizacion" style="margin-top: 15px; font-weight: bold;"></p>

<script>
document.getElementById('formCotizacion').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnCotizar');
    const estado = document.getElementById('estadoCotizacion');
    
    btn.textContent = 'Enviando cotización...';
    btn.disabled = true;

    // Recolectamos los datos de los campos
    const datos = {
        nombre: document.getElementById('nombre').value,
        email: document.getElementById('email').value,
        producto: document.getElementById('producto').value,
        mensaje: document.getElementById('mensaje').value
    };

    try {
        const res = await fetch('/api/enviar', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        });

        if (res.ok) {
            estado.style.color = 'green';
            estado.textContent = '¡Cotización enviada con éxito! Te contactaremos pronto.';
            document.getElementById('formCotizacion').reset();
        } else {
            throw new Error('Error en el servidor');
        }
    } catch (error) {
        estado.style.color = 'red';
        estado.textContent = 'Hubo un error al enviar la cotización. Inténtalo de nuevo.';
    } finally {
        btn.textContent = 'Enviar Cotización';
        btn.disabled = false;
    }
});
</script>
